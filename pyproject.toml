[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ventana-cero"
version = "0.1.0"
description = "Defensa autónoma del n-day, con prueba. Platanus Hack 26 - AI Security (def/acc)."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "team-21"}]
dependencies = []  # el esqueleto usa solo la librería estándar

[project.scripts]
ventana-cero = "ventana_cero.orchestrator:main"

[tool.setuptools]
packages = ["ventana_cero"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
