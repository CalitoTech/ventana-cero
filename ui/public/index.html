<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ventana Cero — panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@200;300;400&family=Silkscreen&family=Space+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0C0C0C; --panel:#111; --ink:#EDEDED; --muted:#9A9A9A; --faint:#4A4A4A; --line:#232323;
  --sig:#FFD60A; --atk:#E8409E; --mid:#FFD60A;
  --f-d:"Lexend","Helvetica Neue",Arial,sans-serif;
  --f-m:"Space Mono",ui-monospace,Consolas,monospace;
  --f-px:"Silkscreen","Space Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--f-d);font-weight:300;font-size:15px;line-height:1.6;font-variant-numeric:tabular-nums}
.wrap{max-width:980px;margin:0 auto;padding:0 32px 96px}
@media(max-width:640px){.wrap{padding:0 16px 60px}}

/* top bar */
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:26px 0;font-family:var(--f-m);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);flex-wrap:wrap}
.brand{font-family:var(--f-px);font-size:15px;line-height:.95;letter-spacing:.08em;color:var(--ink);display:inline-block}
.brand i{font-style:normal;display:inline-block;width:.62em;height:.62em;background:var(--atk);margin:0 1em 0 .2em;box-shadow:.78em 0 0 var(--sig)}
.top .run{display:flex;gap:20px;flex-wrap:wrap}
.key{border:1px solid var(--faint);border-radius:999px;padding:1px 9px;color:var(--ink)}
button{font-family:var(--f-d);font-size:14px;font-weight:400;color:var(--ink);background:#2A2A2A;border:1px solid var(--faint);border-radius:999px;padding:8px 22px;cursor:pointer;transition:background .15s}
button:hover{background:#363636}
button:disabled{background:transparent;color:var(--faint);cursor:default}
button:focus-visible{outline:1px solid var(--sig);outline-offset:3px}

/* section label */
.sec{display:flex;align-items:center;gap:10px;margin:72px 0 22px;font-family:var(--f-m);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--sig)}
.sec b{color:var(--sig);font-weight:400}
.sec::after{content:"";width:9px;height:9px;background:var(--sig)}

/* hero */
.hero{display:grid;grid-template-columns:1fr 1fr;margin-top:48px}
@media(max-width:760px){.hero{grid-template-columns:1fr}}
.side{padding:8px 0 36px}
.side+.side{padding-left:40px;border-left:1px solid var(--line)}
@media(max-width:760px){.side+.side{border-left:0;border-top:1px solid var(--line);padding-left:0;padding-top:24px}}
.side .lbl{font-family:var(--f-m);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.side .lbl::before{content:"› ";color:var(--atk)}
.side .num{font-weight:200;font-size:clamp(4rem,11vw,8.5rem);line-height:.95;letter-spacing:-.04em;margin:14px 0 12px}
.side .num small{font-size:.32em;letter-spacing:0;font-weight:300;margin-left:.14em;color:var(--muted)}
.side.atk .num{color:var(--atk)}
.side.def .num{color:var(--sig)}
.side .note{color:var(--muted);font-size:14px;max-width:36ch}
.ratio{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:20px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);flex-wrap:wrap}
.ratio .big{font-weight:300;font-size:1.75rem}
.ratio .big em{font-style:normal;color:var(--sig);font-weight:400}
.ratio span{color:var(--muted);font-family:var(--f-m);font-size:12px}

/* timeline: cells like the ARC task boards */
.tl{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:6px;position:relative;padding-top:10px}
.tl .fill{position:absolute;top:0;left:0;height:3px;background:var(--sig);width:0}
.tl .ev{padding:14px;border:1px solid var(--line);background:var(--panel);opacity:.3;transition:opacity .25s,border-color .25s}
.tl .ev.on{opacity:1;border-color:var(--faint)}
.tl .ev .t{font-weight:300;font-size:1.6rem;letter-spacing:-.02em}
.tl .ev .t small{font-size:.55em;color:var(--muted);margin-left:2px}
.tl .ev .n{font-family:var(--f-m);font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-top:4px}
.tl .ev.fin.on{border-color:var(--sig)}
.tl .ev.fin.on .t,.tl .ev.fin.on .n{color:var(--sig)}
@media(max-width:760px){.tl{grid-template-columns:1fr 1fr}}

/* case grid */
.case{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);border:1px solid var(--line);background:var(--panel)}
@media(max-width:860px){.case{grid-template-columns:1fr}}
.cell{padding:24px 26px;border-bottom:1px solid var(--line)}
.col{min-width:0}
.case>.col+.col{border-left:1px solid var(--line)}
@media(max-width:860px){.case>.col+.col{border-left:0}}
.cell:last-child{border-bottom:0}
.cell h3{margin:0 0 16px;font-family:var(--f-m);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);font-weight:400}
.cell h3::before{content:"› ";color:var(--atk)}
.ctitle{font-weight:300;font-size:1.6rem;line-height:1.2;margin:6px 0 14px}
.tags{display:flex;gap:16px;flex-wrap:wrap;font-family:var(--f-m);font-size:12px;color:var(--muted)}
.tags b{color:var(--ink);font-weight:400}
.tags .hot{color:var(--atk)}

.taint{display:flex;flex-direction:column}
.taint .st{display:flex;gap:14px;align-items:flex-start;opacity:.15;transition:opacity .3s}
.taint .st.on{opacity:1}
.taint .rail{display:flex;flex-direction:column;align-items:center;padding-top:6px}
.taint .dot{width:11px;height:11px;border:1px solid var(--ink)}
.taint .st.src .dot{background:var(--atk);border-color:var(--atk)}
.taint .st.sink .dot{background:var(--sig);border-color:var(--sig)}
.taint .bar{width:1px;height:24px;background:var(--faint)}
.taint .st:last-child .bar{display:none}
.taint .k{font-family:var(--f-m);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.taint .v{font-family:var(--f-m);font-size:13px;overflow-wrap:anywhere}

.ladder{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;align-items:end}
.rung{padding-top:6px;opacity:.3;transition:opacity .2s}
.rung .h{background:var(--line);border:1px solid var(--faint);margin-bottom:8px;transition:background .2s}
.rung.on{opacity:1}
.rung.on .h{background:var(--ink);border-color:var(--ink)}
.rung.on.cur .h{background:var(--sig);border-color:var(--sig)}
.rung .n{font-family:var(--f-m);font-size:13px}
.rung .t{font-size:11px;color:var(--muted);line-height:1.25}

.term{background:#070707;font-family:var(--f-m);font-size:13px;padding:18px 20px;min-height:178px;border-top:1px solid var(--line)}
.term .ln{white-space:pre-wrap;overflow-wrap:anywhere;min-height:1.5em}
.term .p{color:var(--muted)}
.term .bad{color:var(--atk)}
.term .ok{color:var(--sig)}
.term .sys{color:var(--muted)}
.caret{display:inline-block;width:8px;height:1.05em;background:var(--sig);vertical-align:-2px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}

/* triage table */
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-family:var(--f-m);font-weight:400;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:0 12px 10px 0;border-bottom:1px solid var(--faint)}
td{padding:13px 12px 13px 0;border-bottom:1px solid var(--line);vertical-align:middle}
tr.noise td{color:var(--faint)}
tr.noise td .lv i.on{background:var(--faint);border-color:var(--faint)}
td .sum{color:var(--muted);font-size:13px;display:block}
tr.noise td .sum{color:var(--faint)}
.lv{display:inline-grid;grid-template-columns:repeat(5,11px);gap:2px;vertical-align:middle}
.lv i{width:11px;height:11px;border:1px solid var(--line)}
.lv i.on{background:var(--ink);border-color:var(--ink)}
.lv i.on.top{background:var(--sig);border-color:var(--sig)}
.dec{font-family:var(--f-m);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.dec.actuar{color:var(--sig)} .dec.revisar,.dec.preparar{color:var(--atk)}
.pri.critica{color:var(--atk)}
@media(max-width:700px){.hide-s{display:none}}

.mode{font-family:var(--f-m);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.mode.live{color:var(--sig)} .mode.live::before{content:"";display:inline-block;width:8px;height:8px;background:var(--sig);margin-right:7px}
.mode.busy{color:var(--atk)}
.err{border:1px solid var(--atk);padding:18px;margin-top:40px}
.foot{margin-top:56px;color:var(--faint);font-family:var(--f-m);font-size:12px}
code{font-family:var(--f-m);color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <span class="brand">VENTANA<i></i><br>CERO</span>
    <span class="run" id="run">cargando corrida…</span>
    <span><span class="mode" id="mode"></span> &nbsp; <span class="key">espacio</span> &nbsp; <button id="play">Reproducir</button></span>
  </div>
  <div id="app"></div>
  <p class="foot">Panel estático: lee <code>run.json</code> generado por <code>python -m ventana_cero</code>. En vivo con <code>python -m ventana_cero.server</code>.</p>
</div>
<script>
const NIV = ["dependencia presente","símbolo referenciado","alcanzable","con taint","PoC confirmado"];
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const norm = s => String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"");
let DATA = null, HERO = null, playing = false, LIVE = false;

function splitDur(s){
  if(s==null) return ["—",""];
  if(s<90) return [s.toFixed(2),"s"];
  if(s<5400) return [String(Math.round(s/60)),"min"];
  return [(s/3600).toFixed(1).replace(/\.0$/,""),"h"];
}
const durHTML = s => { const [n,u]=splitDur(s); return `${n}<small>${u}</small>`; };

function ladder(nivel, upto){
  const top = upto==null ? nivel : upto;
  return `<div class="ladder">` + NIV.map((t,i)=>
    `<div class="rung ${i<=top?"on":""} ${i===top?"cur":""}"><div class="h" style="height:${10+i*9}px"></div><div class="n">${i}</div><div class="t">${t}</div></div>`
  ).join("") + `</div>`;
}

function timeline(h){
  const et = h.etapas||[];
  return `<div class="tl" id="tl" style="--n:${et.length}"><div class="fill" id="fill"></div>
    ${et.map((e,i)=>`<div class="ev ${i===et.length-1?"fin":""}" data-t="${e.t}">
      <div class="t">${e.t.toFixed(3)}<small>s</small></div><div class="n">${esc(e.etapa)}</div></div>`).join("")}
  </div>`;
}

function taint(h){
  const p = h.camino_taint||[];
  return `<div class="taint">` + p.map((s,i)=>{
    const m = s.match(/^(\w+):\s*(.*)$/); const k = m?m[1]:"paso", v = m?m[2]:s;
    const cls = i===0?"src":(i===p.length-1?"sink":"");
    return `<div class="st ${cls} on"><div class="rail"><div class="dot"></div><div class="bar"></div></div>
      <div><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div></div>`;
  }).join("") + `</div>`;
}

function termLines(h){
  const p = h.poc, url = `${p.ruta}?${p.param}=${p.valor||""}`;
  const L = [
    [`<span class="p">$</span> `, `curl "${url}"`, ""],
    ["", `${p.respuesta_muestra||""} ${p.respuesta_codigo||200}`, "bad"],
    ["", `# ${p.descr||"PoC reproducido"}`, "p"],
  ];
  if(h.parche_virtual_verificado){
    L.push(["", `[ventana-cero] parche virtual ${h.parche_virtual.id} activo`, "sys"]);
    L.push([`<span class="p">$</span> `, `curl "${url}"`, ""]);
    L.push(["", "403 bloqueado", "ok"]);
  }
  return L;
}
const termStatic = h => termLines(h).map(([pre,t,c])=>`<div class="ln">${pre}<span class="${c}">${esc(t)}</span></div>`).join("");

function triage(d){
  return `<table><thead><tr><th>Aviso</th><th class="hide-s">Paquete</th><th>Nivel</th><th class="hide-s">Prioridad</th><th>Decisión</th></tr></thead><tbody>` +
    d.hallazgos.map(h=>{
      const noise = !["actuar","revisar"].includes(h.decision);
      const lv = NIV.map((_,i)=>`<i class="${i<=h.nivel?"on":""} ${i===h.nivel&&h.nivel===4?"top":""}"></i>`).join("");
      return `<tr class="${noise?"noise":""}"><td>${esc(h.advisory_id)}<span class="sum">${esc(h.resumen)}</span></td>
        <td class="hide-s">${esc(h.paquete)}==${esc(h.version)}</td>
        <td><span class="lv">${lv}</span> ${h.nivel}</td>
        <td class="hide-s pri ${norm(h.prioridad)}">${esc(h.prioridad)}</td>
        <td class="dec ${h.decision}">${esc(h.decision).toUpperCase()}</td></tr>`;
    }).join("") + `</tbody></table>`;
}

function render(d){
  const r = d.resumen||{};
  HERO = d.hallazgos.find(h=>h.poc && h.parche_virtual_verificado) || d.hallazgos[0];
  const def = HERO.segundos_hasta_mitigar;
  const x = def ? Math.round(d.atacante_seg_supuesto/def) : null;
  $("#run").innerHTML = `<span>corrida ${esc(d.generado)}</span><span>${d.segundos_totales} s total</span><span>${r.total||d.hallazgos.length} avisos</span>`;
  $("#app").innerHTML = `
  <section class="hero">
    <div class="side atk"><div class="lbl">Atacante con IA · supuesto</div>
      <div class="num">${durHTML(d.atacante_seg_supuesto)}</div>
      <div class="note">del aviso público al exploit funcionando.</div></div>
    <div class="side def"><div class="lbl">Ventana Cero · medido</div>
      <div class="num" id="defnum">${durHTML(def)}</div>
      <div class="note">del aviso a la mitigación verificada contra el PoC.</div></div>
  </section>
  <div class="ratio"><div class="big">${x?`<em>${x.toLocaleString("es")}×</em> antes que el atacante`:""}</div>
    <span>${r.accionables||0} accionables · ${r.ruido_descartado||0} descartados como ruido</span></div>

  <div class="sec"><b>01</b> La carrera · ${esc(HERO.advisory_id)}</div>
  ${timeline(HERO)}

  <div class="sec"><b>02</b> La prueba</div>
  <div class="case">
    <div class="col">
      <div class="cell">
        <div class="tags"><span>${esc(HERO.advisory_id)}</span><span>${esc(HERO.paquete)}==${esc(HERO.version)}</span></div>
        <div class="ctitle">${esc(HERO.resumen)}</div>
        <div class="tags"><span>clase <b>${esc(HERO.clase||"—")}</b></span><span>EPSS <b>${HERO.epss??"—"}</b></span>${HERO.kev?`<span class="hot">en KEV</span>`:""}<span>prioridad <b class="${norm(HERO.prioridad)==="critica"?"hot":""}">${esc(HERO.prioridad)}</b></span></div>
      </div>
      <div class="cell"><h3>Camino de taint</h3><div id="taint">${taint(HERO)}</div></div>
      <div class="cell"><h3>Escalera de confianza</h3><div id="ladder">${ladder(HERO.nivel)}</div></div>
    </div>
    <div class="col">
      <div class="cell"><h3>Parche virtual</h3>
        <div class="tags" style="flex-direction:column;gap:6px">
          <span>regla <b>${esc(HERO.parche_virtual?.descr||"—")}</b></span>
          <span>estado ${HERO.parche_virtual_verificado?`<b style="color:var(--sig)">verificado: el PoC ya no se dispara</b>`:`<b class="hot">sin verificar</b>`}</span>
          ${HERO.pr_parche_codigo?`<span>parche de código <b>${esc(HERO.pr_parche_codigo)}</b> · requiere revisión humana</span>`:""}
        </div></div>
      <div class="term" id="term">${HERO.poc?termStatic(HERO):""}</div>
    </div>
  </div>

  <div class="sec"><b>03</b> El triage · ${r.total||d.hallazgos.length} avisos</div>
  ${triage(d)}`;
  resetTimeline(true);
}

function resetTimeline(full){
  const f=$("#fill"); if(!f) return;
  f.style.width = full ? "100%" : "0%";
  $$("#tl .ev").forEach(e=>e.classList.toggle("on", !!full));
}

async function tween(ms, fn){
  const t0=performance.now();
  return new Promise(res=>{ const step=now=>{ const k=Math.min(1,(now-t0)/ms); fn(k); k<1?requestAnimationFrame(step):res(); }; requestAnimationFrame(step); });
}

async function typeLine(el, pre, text, cls, speed){
  const line=document.createElement("div"); line.className="ln"; el.appendChild(line);
  const span=document.createElement("span"); span.className=cls;
  line.innerHTML=pre; line.appendChild(span);
  const caret=document.createElement("span"); caret.className="caret"; line.appendChild(caret);
  if(speed){ for(const ch of text){ span.textContent+=ch; await sleep(speed); } }
  else span.textContent=text;
  caret.remove();
}

function setMode(cls, txt){ const m=$("#mode"); m.className="mode "+cls; m.textContent=txt; }

// live: POST /api/run runs the real loop, then the panel replays that fresh run
async function run(){
  if(playing) return;
  if(!LIVE) return play();
  playing=true; $("#play").disabled=true; setMode("busy","analizando…");
  try{
    const r=await fetch("api/run",{method:"POST"});
    const d=await r.json();
    if(!r.ok) throw new Error(d.error||r.status);
    DATA=d; render(d); setMode("live","en vivo · corrida recién hecha");
  }catch(e){
    setMode("busy","falló la corrida: "+e.message); playing=false; $("#play").disabled=false; return;
  }
  playing=false; play();
}

async function play(){
  if(playing||!HERO) return; playing=true; $("#play").disabled=true;
  const h=HERO, T=h.segundos_hasta_mitigar||1, defnum=$("#defnum");
  // reset
  resetTimeline(false);
  $$("#taint .st").forEach(s=>s.classList.remove("on"));
  $("#ladder").innerHTML=ladder(h.nivel,-1);
  const term=$("#term"); term.innerHTML="";
  defnum.innerHTML=durHTML(0);
  $("#tl").scrollIntoView({behavior:"smooth",block:"center"});
  await sleep(700);

  // 1. race: playhead moves along sqrt axis; real clock counts up
  // stages are evenly spaced; the fill follows the stage index while the clock shows real time
  const evs=$$("#tl .ev"), fill=$("#fill"), ts=evs.map(e=>+e.dataset.t), n=ts.length;
  await tween(4200, k=>{
    const pos=k*(n-1), i=Math.min(n-2,Math.floor(pos)), f=pos-i;
    const t=n>1 ? ts[i]+(ts[i+1]-ts[i])*f : T;
    fill.style.width=(((pos+0.5)/n)*100)+"%";
    defnum.innerHTML=durHTML(t);
    evs.forEach((e,j)=>e.classList.toggle("on", j<=pos+1e-9));
  });
  defnum.innerHTML=durHTML(T); fill.style.width="100%";
  await sleep(900);

  // 2. proof
  $("#taint").scrollIntoView({behavior:"smooth",block:"center"});
  await sleep(600);
  for(const s of $$("#taint .st")){ s.classList.add("on"); await sleep(450); }
  for(let i=0;i<=h.nivel;i++){ $("#ladder").innerHTML=ladder(h.nivel,i); await sleep(320); }
  if(h.poc){
    const L=termLines(h);
    for(const [pre,t,c] of L){ await typeLine(term,pre,t,c, pre?18:0); await sleep(pre?250:550); }
  }
  await sleep(800);
  $("table").scrollIntoView({behavior:"smooth",block:"center"});
  playing=false; $("#play").disabled=false;
}

fetch("api/status").then(r=>r.ok?r.json():null).catch(()=>null).then(st=>{
  LIVE=!!(st&&st.en_vivo);
  $("#play").textContent = LIVE ? "Correr análisis" : "Reproducir";
  setMode(LIVE?"live":"", LIVE?"en vivo":"foto de la última corrida");
  return fetch("run.json",{cache:"no-store"});
}).then(r=>r.json()).then(d=>{
  DATA=d; render(d);
  $("#play").addEventListener("click", run);
  document.addEventListener("keydown", e=>{ if(e.code==="Space"&&e.target.tagName!=="BUTTON"){ e.preventDefault(); run(); } });
}).catch(()=>{
  $("#run").textContent=""; $("#play").style.display="none";
  $("#app").innerHTML=`<div class="err">No pude cargar <code>run.json</code>. Corre <code>python -m ventana_cero</code> y sirve esta carpeta con <code>python -m http.server -d ui/public</code>.</div>`;
});
</script>
</body>
</html>
